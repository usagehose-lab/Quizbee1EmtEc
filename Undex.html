<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Quiz Bee</title>
<style>
  :root{
    --bg:#0E1420;
    --panel:#161F2E;
    --panel-edge:#243247;
    --text:#E8EDF4;
    --sub:#8CA0B8;
    --cyan:#4FD8C8;
    --amber:#F0A83A;
    --wrong:#E15B5B;
    --right:#4FD8C8;
    --trace:#1C2A3D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 10%, #172236 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #172a2a 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .label-mono{
    font-family: 'Consolas', 'SF Mono', monospace;
    letter-spacing:0.02em;
  }
  #app{ width:100%; max-width:560px; }

  /* ---------- Circuit trace decoration ---------- */
  .trace-row{
    display:flex; align-items:center; gap:6px;
    margin-bottom:18px; opacity:0.7;
  }
  .trace-row .node{ width:6px; height:6px; border-radius:50%; background:var(--cyan); flex-shrink:0; }
  .trace-row .line{ height:1px; flex:1; background:var(--trace); }

  /* ---------- Start screen ---------- */
  .start-card{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:4px;
    padding:40px 36px;
    position:relative;
  }
  .start-card::before{
    content:"";
    position:absolute; top:0; left:0; width:34px; height:34px;
    border-top:2px solid var(--cyan); border-left:2px solid var(--cyan);
  }
  .start-card::after{
    content:"";
    position:absolute; bottom:0; right:0; width:34px; height:34px;
    border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan);
  }
  .kicker{
    font-family:'Consolas','SF Mono',monospace;
    font-size:12.5px; color:var(--cyan); letter-spacing:0.08em;
    margin-bottom:10px;
  }
  h1{
    font-size:30px; font-weight:600; line-height:1.25; margin-bottom:14px;
  }
  .lede{ color:var(--sub); font-size:15px; line-height:1.6; margin-bottom:28px; max-width:44ch;}
  .part-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:30px; }
  .part-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; background:var(--trace); border-radius:3px;
    font-size:14px;
  }
  .part-row .n{ color:var(--sub); font-family:'Consolas','SF Mono',monospace; font-size:13px;}
  button{
    font-family:inherit; cursor:pointer; border:none;
  }
  .btn-primary{
    background:var(--cyan); color:#0B1119; font-weight:700; font-size:15.5px;
    padding:14px 22px; border-radius:3px; width:100%;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  .btn-primary:hover{ background:#69E4D6; }
  .btn-primary:active{ transform:scale(0.98); }

  /* ---------- Quiz screen ---------- */
  .quiz-card{
    background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:4px; padding:26px 26px 30px;
  }
  .top-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px; font-family:'Consolas','SF Mono',monospace; font-size:12.5px;
    color:var(--sub);
  }
  .section-tag{ color:var(--amber); }
  .progress-track{
    height:4px; background:var(--trace); border-radius:2px; margin-bottom:22px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--cyan); border-radius:2px;
    transition:width 0.3s ease;
  }
  .timer-wrap{
    display:flex; align-items:center; gap:10px; margin-bottom:20px;
  }
  .timer-track{
    flex:1; height:6px; background:var(--trace); border-radius:3px; overflow:hidden;
  }
  .timer-fill{
    height:100%; background:var(--amber); width:100%;
    transition:width 1s linear, background 0.3s ease;
  }
  .timer-num{
    font-family:'Consolas','SF Mono',monospace; font-size:13px; color:var(--sub); width:24px; text-align:right;
  }
  .q-text{
    font-size:19px; line-height:1.45; font-weight:600; margin-bottom:22px; min-height:52px;
  }
  .options{
    display:flex; flex-direction:column; gap:10px;
  }
  .opt{
    display:flex; align-items:center; gap:12px;
    background:var(--trace); border:1px solid transparent; border-radius:3px;
    padding:14px 16px; text-align:left; font-size:14.5px; color:var(--text);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--panel-edge); background:#20304a; }
  .opt .tag{
    font-family:'Consolas','SF Mono',monospace; font-size:12px; color:var(--sub);
    width:16px; flex-shrink:0;
  }
  .opt.correct{ background:rgba(79,216,200,0.15); border-color:var(--right); }
  .opt.wrong{ background:rgba(225,91,91,0.15); border-color:var(--wrong); }
  .opt:disabled{ cursor:default; }
  .opt.dim{ opacity:0.45; }

  .streak-note{
    margin-top:16px; font-family:'Consolas','SF Mono',monospace; font-size:12.5px;
    color:var(--cyan); min-height:16px;
  }

  /* ---------- End screen ---------- */
  .end-card{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:4px;
    padding:38px 34px; text-align:center;
  }
  .score-big{
    font-size:56px; font-weight:700; color:var(--cyan); line-height:1;
    margin:6px 0 4px;
  }
  .score-sub{ color:var(--sub); font-size:14px; margin-bottom:26px; }
  .breakdown{
    display:flex; flex-direction:column; gap:8px; margin-bottom:28px; text-align:left;
  }
  .breakdown .row{
    display:flex; justify-content:space-between; padding:10px 14px;
    background:var(--trace); border-radius:3px; font-size:13.5px;
  }
  .breakdown .row span:last-child{ font-family:'Consolas','SF Mono',monospace; color:var(--sub); }
  .btn-secondary{
    background:transparent; border:1px solid var(--panel-edge); color:var(--text);
    padding:13px 20px; border-radius:3px; width:100%; font-size:14.5px;
  }
  .btn-secondary:hover{ border-color:var(--cyan); }

  @media (max-width:480px){
    .start-card, .quiz-card, .end-card{ padding:26px 20px; }
    h1{ font-size:25px; }
    .q-text{ font-size:17px; }
    .score-big{ font-size:46px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const QUESTIONS = [
// ---- PART I: HARDWARE (1-20) ----
{part:"Hardware", q:"A computer suddenly shuts down because it isn't receiving enough electrical power. What should you check first?",
 opts:["The power supply","The RAM modules","The monitor cable","The cooling fan"], correct:0},
{part:"Hardware", q:"A monitor shows nothing even though the computer is running, and the cable is loose. What's the fix?",
 opts:["Reconnect the loose cable","Replace the GPU","Upgrade the RAM","Replace the motherboard"], correct:0},
{part:"Hardware", q:"A computer gets extremely hot after running for hours. What should be checked?",
 opts:["The cooling system / fans","The RAM","The keyboard","The NIC"], correct:0},
{part:"Hardware", q:"A PC slows down badly with many programs open at once. Which component is likely insufficient?",
 opts:["Upgrade the RAM","Upgrade the GPU","Replace the PSU","Replace the HDD"], correct:0},
{part:"Hardware", q:"A computer can't connect to Wi-Fi even though the router works fine. Which component should be checked?",
 opts:["Network Interface Card (NIC)","Power supply","RAM","Monitor"], correct:0},
{part:"Hardware", q:"A computer struggles to display demanding 3D graphics. Which component is most likely involved?",
 opts:["GPU","CPU","PSU","HDD"], correct:0},
{part:"Hardware", q:"A PC loses all unsaved data the instant power is cut. Which component was holding that temporary data?",
 opts:["RAM","HDD","SSD","ROM"], correct:0},
{part:"Hardware", q:"A computer can't store files because its long-term storage drive has failed. What should be checked or replaced?",
 opts:["The storage drive (HDD/SSD)","RAM","PSU","GPU"], correct:0},
{part:"Hardware", q:"A computer makes odd noises accessing data from a spinning magnetic disk. What device is likely involved?",
 opts:["HDD","SSD","RAM","GPU"], correct:0},
{part:"Hardware", q:"A computer needs faster long-term storage using flash memory. What upgrade fits?",
 opts:["SSD","HDD","RAM","PSU"], correct:0},
{part:"Hardware", q:"A keyboard is connected but the computer doesn't respond to it. What should you check first?",
 opts:["Peripherals / cables","RAM","Motherboard","PSU"], correct:0},
{part:"Hardware", q:"A mouse works intermittently because its USB connection is loose. What should you inspect?",
 opts:["The cables and ports","RAM","GPU","Cooling fan"], correct:0},
{part:"Hardware", q:"A computer is on the network but can't communicate with other devices — its network hardware is malfunctioning. What's involved?",
 opts:["NIC","Router","Modem","PSU"], correct:0},
{part:"Hardware", q:"A computer's internal components can't communicate properly because the main circuit board has a problem. What should be inspected?",
 opts:["Motherboard","CPU","RAM","PSU"], correct:0},
{part:"Hardware", q:"A computer overheats because its cooling system isn't regulating temperature properly. What should be checked?",
 opts:["The cooling fans","GPU","NIC","SSD"], correct:0},
{part:"Hardware", q:"Monitor and storage both work fine, but the PC can't properly execute instructions. Which component should be checked?",
 opts:["CPU","GPU","RAM","HDD"], correct:0},
{part:"Hardware", q:"A computer gets power from the outlet, but internal components aren't receiving the right form of power. What's responsible for that conversion?",
 opts:["PSU","CPU","RAM","Router"], correct:0},
{part:"Hardware", q:"A laptop's graphics processor is malfunctioning. Where is a laptop's GPU commonly located?",
 opts:["Integrated into the main chip / soldered onto the motherboard","On a removable graphics card","Inside the PSU","Inside the monitor"], correct:0},
{part:"Hardware", q:"A smartphone has a graphics-processing problem. Where is its GPU usually located?",
 opts:["Inside the SoC","On a graphics card","Inside the router","Inside the PSU"], correct:0},
{part:"Hardware", q:"Before replacing hardware, you run basic troubleshooting. What's the correct order of the five common steps?",
 opts:["Power supply → cables/ports → drivers/firmware → peripherals → RAM/hard drive",
       "RAM/hard drive → power supply → peripherals → cables/ports → drivers/firmware",
       "Drivers/firmware → peripherals → power supply → RAM/hard drive → cables/ports",
       "Cables/ports → RAM/hard drive → power supply → drivers/firmware → peripherals"], correct:0},

// ---- PART II: SOFTWARE (21-30) ----
{part:"Software", q:"A program has a bug that causes it to crash. Which type of maintenance fixes this?",
 opts:["Corrective maintenance","Preventive maintenance","Perfective maintenance","Adaptive maintenance"], correct:0},
{part:"Software", q:"Developers find a small fault that could become a major problem later. Which type of maintenance addresses this?",
 opts:["Preventive maintenance","Corrective maintenance","Perfective maintenance","Adaptive maintenance"], correct:0},
{part:"Software", q:"Users request new features to make an existing program more useful. Which type of maintenance is this?",
 opts:["Perfective maintenance","Corrective maintenance","Preventive maintenance","Adaptive maintenance"], correct:0},
{part:"Software", q:"A program must be modified because its operating environment changed. Which type of maintenance is needed?",
 opts:["Adaptive maintenance","Corrective maintenance","Preventive maintenance","Perfective maintenance"], correct:0},
{part:"Software", q:"An application is changed and updated after deployment to improve performance. What's this general process called?",
 opts:["Software maintenance","Software development","Software testing","Software installation"], correct:0},
{part:"Software", q:"A user wants to browse websites and navigate the internet. What type of software do they need?",
 opts:["Web browser","Word processor","Operating system","Antivirus"], correct:0},
{part:"Software", q:"A program is installed directly on a device and runs using that device's operating system. What kind of software is this?",
 opts:["Locally installed software","Cloud-based software","Firmware","Malware"], correct:0},
{part:"Software", q:"A program is accessed over the internet and runs on a dedicated server instead of the user's device. What type of software is this?",
 opts:["Cloud-based software","Locally installed software","Firmware","Driver software"], correct:0},
{part:"Software", q:"A vendor receives error reports from users and releases a fix. What type of maintenance is being performed?",
 opts:["Corrective maintenance","Preventive maintenance","Perfective maintenance","Adaptive maintenance"], correct:0},
{part:"Software", q:"An application needs to work with newly changed hardware or OS requirements. What type of maintenance is needed?",
 opts:["Adaptive maintenance","Corrective maintenance","Preventive maintenance","Perfective maintenance"], correct:0},

// ---- PART III: MULTIPLE CHOICE / COMPONENT ID (31-60) ----
{part:"Component ID", q:"Which component is often called the \u201cbrain\u201d of the computer?",
 opts:["RAM","CPU","GPU","PSU"], correct:1},
{part:"Component ID", q:"Which component connects the CPU, RAM, storage, and other parts together?",
 opts:["Motherboard","GPU","PSU","NIC"], correct:0},
{part:"Component ID", q:"Which component provides temporary, high-speed memory?",
 opts:["HDD","SSD","RAM","ROM"], correct:2},
{part:"Component ID", q:"Which component is volatile (loses data when power is cut)?",
 opts:["HDD","SSD","RAM","Motherboard"], correct:2},
{part:"Component ID", q:"Which component renders images, video, and 3D graphics?",
 opts:["CPU","GPU","PSU","NIC"], correct:1},
{part:"Component ID", q:"Which component converts electrical power from an outlet into the form needed by internal parts?",
 opts:["CPU","PSU","RAM","Router"], correct:1},
{part:"Component ID", q:"Which component regulates system temperature and helps prevent overheating?",
 opts:["Cooling fan","GPU","NIC","SSD"], correct:0},
{part:"Component ID", q:"Which of these is an input device?",
 opts:["Monitor","Printer","Keyboard","Speaker"], correct:2},
{part:"Component ID", q:"Which of these is an output device?",
 opts:["Mouse","Microphone","Webcam","Monitor"], correct:3},
{part:"Component ID", q:"Which device uses spinning magnetic disks to store data?",
 opts:["SSD","HDD","RAM","GPU"], correct:1},
{part:"Component ID", q:"Which storage device uses flash memory and has no moving parts?",
 opts:["HDD","SSD","RAM","PSU"], correct:1},
{part:"Component ID", q:"Which device forwards data packets between different networks?",
 opts:["Modem","Router","NIC","SSD"], correct:1},
{part:"Component ID", q:"Which networking device connects a network to the internet?",
 opts:["Modem","GPU","Router","RAM"], correct:0},
{part:"Component ID", q:"Which component lets a device connect to a network through Ethernet or Wi-Fi?",
 opts:["NIC","PSU","CPU","HDD"], correct:0},
{part:"Component ID", q:"Which motherboard form factor is the smallest?",
 opts:["ATX","Micro-ATX","Mini-ITX","Full ATX"], correct:2},
{part:"Component ID", q:"Which motherboard form factor is mid-sized?",
 opts:["Mini-ITX","Micro-ATX","ATX","Nano-ATX"], correct:1},
{part:"Component ID", q:"Which is the full-sized, most common standard motherboard form factor?",
 opts:["Mini-ITX","Micro-ATX","ATX","Mobile-ATX"], correct:2},
{part:"Component ID", q:"Which component performs the Fetch–Decode–Execute cycle?",
 opts:["CPU","GPU","RAM","PSU"], correct:0},
{part:"Component ID", q:"In the CPU cycle, which step retrieves an instruction from memory?",
 opts:["Execute","Decode","Fetch","Process"], correct:2},
{part:"Component ID", q:"In the CPU cycle, which step interprets what an instruction means?",
 opts:["Fetch","Decode","Execute","Store"], correct:1},
{part:"Component ID", q:"In the CPU cycle, which step carries out the instruction?",
 opts:["Fetch","Decode","Execute","Retrieve"], correct:2},
{part:"Component ID", q:"Which component is usually located near the CPU on a motherboard?",
 opts:["RAM","Modem","Monitor","Router"], correct:0},
{part:"Component ID", q:"On a typical desktop PC, where is the GPU usually found?",
 opts:["Inside the keyboard","On a graphics card plugged into the motherboard","Inside the PSU","Inside the monitor"], correct:1},
{part:"Component ID", q:"In a laptop, the GPU is usually:",
 opts:["Inside the keyboard","Integrated into the main chip or soldered onto the motherboard","Connected through a network cable","Located inside the monitor"], correct:1},
{part:"Component ID", q:"In a mobile phone, the GPU is usually:",
 opts:["Inside the SoC","Inside the router","Inside the PSU","On a removable graphics card"], correct:0},
{part:"Component ID", q:"Which device presents processed information visually to the user?",
 opts:["Monitor","Mouse","Keyboard","NIC"], correct:0},
{part:"Component ID", q:"Which device produces printed output?",
 opts:["Webcam","Printer","Microphone","Router"], correct:1},
{part:"Component ID", q:"Which device captures sound as input?",
 opts:["Speaker","Monitor","Microphone","Printer"], correct:2},
{part:"Component ID", q:"Which device lets a user send commands and data to a computer?",
 opts:["Keyboard","Monitor","Speaker","Printer"], correct:0},
{part:"Component ID", q:"Which component is primarily responsible for processing large amounts of graphics data quickly, in parallel?",
 opts:["HDD","GPU","PSU","Motherboard"], correct:1},
];

const TIME_LIMIT = 10; // seconds per question
const LETTERS = ["A","B","C","D"];

let state = {
  idx: 0,
  score: 0,
  answered: false,
  timer: null,
  timeLeft: TIME_LIMIT,
  order: [], // shuffled option order per question
  streak: 0,
  bestStreak: 0,
  partCounts: {}, // part -> {correct, total}
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderStart(){
  clearInterval(state.timer);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="trace-row"><div class="node"></div><div class="line"></div><div class="node"></div></div>
    <div class="start-card">
      <div class="kicker label-mono">DIAGNOSTIC ROUND · 31 QUESTIONS</div>
      <h1>Software &amp; Hardware<br>Maintenance Quiz Bee</h1>
      <p class="lede">Identify the failing component, the fix, and the right maintenance call — 20 seconds on the clock per question.</p>
      <div class="part-list">
        <div class="part-row"><span>Hardware — problem &amp; solution</span><span class="n">20 Q</span></div>
        <div class="part-row"><span>Software — problem &amp; solution</span><span class="n">10 Q</span></div>
        <div class="part-row"><span>Multiple choice — identify the component</span><span class="n">30 Q</span></div>
      </div>
      <button class="btn-primary" id="startBtn">Start quiz</button>
    </div>
  `;
  document.getElementById('startBtn').onclick = () => {
    state = {idx:0, score:0, answered:false, timer:null, timeLeft:TIME_LIMIT, order:[], streak:0, bestStreak:0, partCounts:{}};
    renderQuestion();
  };
}

function renderQuestion(){
  clearInterval(state.timer);
  const total = QUESTIONS.length;
  const q = QUESTIONS[state.idx];
  state.answered = false;
  state.timeLeft = TIME_LIMIT;

  // build shuffled option order once per question
  const optOrder = shuffle([0,1,2,3]);
  state.order = optOrder;

  const app = document.getElementById('app');
  const pct = ((state.idx)/total)*100;

  app.innerHTML = `
    <div class="quiz-card">
      <div class="top-row">
        <span class="section-tag label-mono">${q.part.toUpperCase()}</span>
        <span class="label-mono">Q${state.idx+1} / ${total} &nbsp;·&nbsp; SCORE ${state.score}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="timer-wrap">
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-num label-mono" id="timerNum">${TIME_LIMIT}</div>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="options">
        ${optOrder.map((oi,pos)=>`
          <button class="opt" data-oi="${oi}">
            <span class="tag">${LETTERS[pos]}</span><span>${q.opts[oi]}</span>
          </button>
        `).join('')}
      </div>
      <div class="streak-note" id="streakNote">${state.streak>=2 ? state.streak+"-question streak" : ""}</div>
    </div>
  `;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=> selectAnswer(parseInt(btn.dataset.oi)));
  });

  startTimer();
}

function startTimer(){
  const fill = document.getElementById('timerFill');
  const num = document.getElementById('timerNum');
  state.timer = setInterval(()=>{
    state.timeLeft -= 1;
    if(num) num.textContent = Math.max(state.timeLeft,0);
    if(fill){
      const pct = Math.max(state.timeLeft,0)/TIME_LIMIT*100;
      fill.style.width = pct+"%";
      fill.style.background = state.timeLeft<=5 ? "var(--wrong)" : "var(--amber)";
    }
    if(state.timeLeft<=0){
      clearInterval(state.timer);
      if(!state.answered) selectAnswer(null);
    }
  },1000);
}

function selectAnswer(chosenIdx){
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timer);

  const q = QUESTIONS[state.idx];
  const part = q.part;
  if(!state.partCounts[part]) state.partCounts[part] = {correct:0,total:0};
  state.partCounts[part].total += 1;

  const isCorrect = chosenIdx === q.correct;
  if(isCorrect){
    state.score += 1;
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.partCounts[part].correct += 1;
  } else {
    state.streak = 0;
  }

  document.querySelectorAll('.opt').forEach(btn=>{
    const oi = parseInt(btn.dataset.oi);
    btn.disabled = true;
    if(oi === q.correct) btn.classList.add('correct');
    else if(oi === chosenIdx) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const note = document.getElementById('streakNote');
  if(note){
    note.textContent = isCorrect
      ? (state.streak>=2 ? state.streak+"-question streak" : "Correct")
      : (chosenIdx===null ? "Time's up" : "Not quite");
    note.style.color = isCorrect ? "var(--cyan)" : "var(--wrong)";
  }

  setTimeout(()=>{
    if(state.idx < QUESTIONS.length-1){
      state.idx += 1;
      renderQuestion();
    } else {
      renderEnd();
    }
  }, 1400);
}

function renderEnd(){
  clearInterval(state.timer);
  const total = QUESTIONS.length;
  const pct = Math.round((state.score/total)*100);
  const app = document.getElementById('app');

  const rows = Object.keys(state.partCounts).map(part=>{
    const c = state.partCounts[part];
    return `<div class="row"><span>${part}</span><span>${c.correct} / ${c.total}</span></div>`;
  }).join('');

  app.innerHTML = `
    <div class="trace-row"><div class="node"></div><div class="line"></div><div class="node"></div></div>
    <div class="end-card">
      <div class="kicker label-mono">RESULTS</div>
      <div class="score-big">${state.score}/${total}</div>
      <div class="score-sub">${pct}% correct &nbsp;·&nbsp; best streak ${state.bestStreak}</div>
      <div class="breakdown">${rows}</div>
      <button class="btn-primary" id="retryBtn" style="margin-bottom:10px;">Retry quiz</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = renderStart;
}

renderStart();
</script>
</body>
</html>
