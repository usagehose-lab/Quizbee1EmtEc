<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Menu</title>
<style>
  :root{
    --bg:#0E1420;
    --panel:#161F2E;
    --panel-edge:#243247;
    --text:#E8EDF4;
    --sub:#8CA0B8;
    --cyan:#4FD8C8;
    --amber:#F0A83A;
    --wrong:#E15B5B;
    --right:#4FD8C8;
    --trace:#1C2A3D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 10%, #172236 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #172a2a 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .label-mono{ font-family: 'Consolas', 'SF Mono', monospace; letter-spacing:0.02em; }
  #app{ width:100%; max-width:560px; }

  .trace-row{ display:flex; align-items:center; gap:6px; margin-bottom:18px; opacity:0.7; }
  .trace-row .node{ width:6px; height:6px; border-radius:50%; background:var(--cyan); flex-shrink:0; }
  .trace-row .line{ height:1px; flex:1; background:var(--trace); }

  .panel-card{ background:var(--panel); border:1px solid var(--panel-edge); border-radius:4px; padding:36px 32px; position:relative; }
  .panel-card::before{ content:""; position:absolute; top:0; left:0; width:34px; height:34px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
  .panel-card::after{ content:""; position:absolute; bottom:0; right:0; width:34px; height:34px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }

  .kicker{ font-family:'Consolas','SF Mono',monospace; font-size:12.5px; color:var(--cyan); letter-spacing:0.08em; margin-bottom:10px; }
  h1{ font-size:27px; font-weight:600; line-height:1.3; margin-bottom:8px; }
  .lede{ color:var(--sub); font-size:14.5px; line-height:1.6; margin-bottom:26px; }

  .crumbs{ font-family:'Consolas','SF Mono',monospace; font-size:12px; color:var(--sub); margin-bottom:20px; }
  .crumbs span.on{ color:var(--cyan); }

  .menu-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .menu-grid.cols2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  button{ font-family:inherit; cursor:pointer; border:none; }
  .menu-btn{
    background:var(--trace); border:1px solid var(--panel-edge); color:var(--text);
    padding:15px 16px; border-radius:3px; text-align:left; font-size:14.5px;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .menu-btn:hover{ border-color:var(--cyan); background:#20304a; }
  .menu-btn.all-lessons{ border-color:var(--amber); color:var(--amber); font-weight:600; }
  .menu-btn.all-lessons:hover{ background:rgba(240,168,58,0.12); }
  .menu-btn .count{ display:block; font-family:'Consolas','SF Mono',monospace; font-size:11.5px; color:var(--sub); margin-top:3px; }

  .back-link{
    background:transparent; color:var(--sub); font-size:13px; font-family:'Consolas','SF Mono',monospace;
    padding:6px 0; margin-bottom:18px; display:inline-flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--cyan); }

  .btn-primary{ background:var(--cyan); color:#0B1119; font-weight:700; font-size:15.5px; padding:14px 22px; border-radius:3px; width:100%; transition:transform 0.12s ease, background 0.12s ease; }
  .btn-primary:hover{ background:#69E4D6; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:0.4; cursor:default; }

  .empty-note{
    font-family:'Consolas','SF Mono',monospace; font-size:13px; color:var(--wrong);
    background:rgba(225,91,91,0.1); border:1px solid rgba(225,91,91,0.3);
    padding:12px 14px; border-radius:3px; margin-bottom:20px;
  }

  /* ---------- Quiz screen (same engine as before) ---------- */
  .quiz-card{ background:var(--panel); border:1px solid var(--panel-edge); border-radius:4px; padding:26px 26px 30px; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-family:'Consolas','SF Mono',monospace; font-size:12.5px; color:var(--sub); }
  .section-tag{ color:var(--amber); }
  .progress-track{ height:4px; background:var(--trace); border-radius:2px; margin-bottom:22px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--cyan); border-radius:2px; transition:width 0.3s ease; }
  .timer-wrap{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .timer-track{ flex:1; height:6px; background:var(--trace); border-radius:3px; overflow:hidden; }
  .timer-fill{ height:100%; background:var(--amber); width:100%; transition:width 1s linear, background 0.3s ease; }
  .timer-num{ font-family:'Consolas','SF Mono',monospace; font-size:13px; color:var(--sub); width:24px; text-align:right; }
  .q-text{ font-size:19px; line-height:1.45; font-weight:600; margin-bottom:22px; min-height:52px; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{ display:flex; align-items:center; gap:12px; background:var(--trace); border:1px solid transparent; border-radius:3px; padding:14px 16px; text-align:left; font-size:14.5px; color:var(--text); transition:border-color 0.15s ease, background 0.15s ease; }
  .opt:hover:not(:disabled){ border-color:var(--panel-edge); background:#20304a; }
  .opt .tag{ font-family:'Consolas','SF Mono',monospace; font-size:12px; color:var(--sub); width:16px; flex-shrink:0; }
  .opt.correct{ background:rgba(79,216,200,0.15); border-color:var(--right); }
  .opt.wrong{ background:rgba(225,91,91,0.15); border-color:var(--wrong); }
  .opt:disabled{ cursor:default; }
  .opt.dim{ opacity:0.45; }

  .type-wrap{ display:flex; flex-direction:column; gap:12px; }
  .type-input{ background:var(--trace); border:1px solid var(--panel-edge); border-radius:3px; padding:14px 16px; font-size:15px; color:var(--text); font-family:inherit; }
  .type-input:focus{ outline:none; border-color:var(--cyan); }
  .type-input.correct{ border-color:var(--right); background:rgba(79,216,200,0.12); }
  .type-input.wrong{ border-color:var(--wrong); background:rgba(225,91,91,0.12); }
  .type-feedback{ font-family:'Consolas','SF Mono',monospace; font-size:13px; min-height:16px; }
  .type-feedback.correct{ color:var(--right); }
  .type-feedback.wrong{ color:var(--wrong); }

  .streak-note{ margin-top:16px; font-family:'Consolas','SF Mono',monospace; font-size:12.5px; color:var(--cyan); min-height:16px; }

  .end-card{ background:var(--panel); border:1px solid var(--panel-edge); border-radius:4px; padding:38px 34px; text-align:center; }
  .score-big{ font-size:56px; font-weight:700; color:var(--cyan); line-height:1; margin:6px 0 4px; }
  .score-sub{ color:var(--sub); font-size:14px; margin-bottom:26px; }
  .breakdown{ display:flex; flex-direction:column; gap:8px; margin-bottom:28px; text-align:left; }
  .breakdown .row{ display:flex; justify-content:space-between; padding:10px 14px; background:var(--trace); border-radius:3px; font-size:13.5px; }
  .breakdown .row span:last-child{ font-family:'Consolas','SF Mono',monospace; color:var(--sub); }
  .btn-secondary{ background:transparent; border:1px solid var(--panel-edge); color:var(--text); padding:13px 20px; border-radius:3px; width:100%; font-size:14.5px; margin-top:10px; }
  .btn-secondary:hover{ border-color:var(--cyan); }

  @media (max-width:480px){
    .panel-card, .quiz-card, .end-card{ padding:26px 20px; }
    h1{ font-size:22px; }
    .q-text{ font-size:17px; }
    .score-big{ font-size:46px; }
    .menu-grid.cols2{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>

const TERMS = ["Term 1","Term 2","Term 3"];
const SUBJECTS = ["General Math","General Science","Physics","Finite Mathematics","Empowerment Technologies"];
const LESSON_NUMBERS = Array.from({length:8}, (_,i)=>i+1); // Lesson 1 .. Lesson 12

const TIME_LIMIT = 20; // default seconds per question (override per-question with "time: N")
const QUIZ_LENGTH = 20; // max questions for a single lesson quiz — random subset if the lesson has more
const ALL_LESSONS_LENGTH = 50; // max questions when "All Lessons" is picked — random subset if combined pool has more
const LETTERS = ["A","B","C","D","E","F"];

// Build the empty skeleton — Term -> Subject -> "Lesson N" -> []
const QUESTIONS_DB = {};
TERMS.forEach(term=>{
  QUESTIONS_DB[term] = {};
  SUBJECTS.forEach(subject=>{
    QUESTIONS_DB[term][subject] = {};
    LESSON_NUMBERS.forEach(n=>{
      QUESTIONS_DB[term][subject]["Lesson "+n] = [];
    });
  });
});

/*========================================================================= */
                       /*GENERAL MATHEMATICS*/

QUESTIONS_DB["Term 1"]["General Science"]["Lesson 1"] = [

  { type:"mc", q:"Which is a vector quantity: speed or velocity?", opts:["Velocity","Speed","Both","Neither"], correct:0 },
  { type:"type", q:"Type the formula for speed (use a slash for division, e.g. A/B).", answers:["distance/time"] },
  { type:"type", q:"Type the formula for velocity (use a slash for division, e.g. A/B).", answers:["displacement/time"] },

  { type:"mc", q:"The rate of change of velocity, involving a change in speed and/or direction, measured in m/s², is called:", opts:["Linear acceleration","Linear velocity","Linear displacement","Angular acceleration"], correct:0 },

QUESTIONS_DB["Term 1"]["General Science"]["Lesson 2"] = [

  { type:"mc", q:"Which angular quantity describes how your spinning speed changes?", opts:["Angular acceleration","Angular displacement","Angular velocity","Linear acceleration"], correct:0 },
  { type:"mc", q:"A figure skater spinning faster while pulling their arms in is an example of which quantity?", opts:["Angular velocity","Linear velocity","Displacement","Linear acceleration"], correct:0 },

  { type:"mc", q:"Which device captures sound as an input?", opts:["Speaker","Monitor","Microphone","Printer"], correct:2 },
  { type:"mc", q:"Which device sends commands or data to a computer?", opts:["Keyboard","Monitor","Speaker","Printer"], correct:0 },
  { type:"mc", q:"Which component processes large amounts of graphics data quickly and in parallel?", opts:["HDD","GPU","PSU","Motherboard"], correct:1 }

/* ========================= ENGINE — no touchy please ========================= */

let nav = { term:null, subject:null, lesson:null };
let quizState = {
  idx:0, score:0, answered:false, timer:null, timeLeft:TIME_LIMIT,
  streak:0, bestStreak:0, partCounts:{}, questions:[]
};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function normalize(str){ return str.trim().toLowerCase().replace(/\s+/g,' '); }

function crumbHtml(){
  const t = nav.term ? `<span class="on">${nav.term}</span>` : "Term";
  const s = nav.subject ? `<span class="on">${nav.subject}</span>` : "Subject";
  const l = nav.lesson ? `<span class="on">${nav.lesson}</span>` : "Lesson";
  return `${t} &nbsp;›&nbsp; ${s} &nbsp;›&nbsp; ${l}`;
}

function renderTermMenu(){
  nav = { term:null, subject:null, lesson:null };
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="trace-row"><div class="node"></div><div class="line"></div><div class="node"></div></div>
    <div class="panel-card">
      <div class="kicker label-mono">STEP 1 OF 3</div>
      <h1>Choose a term</h1>
      <p class="lede">Pick the term to start building your quiz.</p>
      <div class="menu-grid">
        ${TERMS.map(t=>`<button class="menu-btn" data-term="${t}">${t}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('[data-term]').forEach(btn=>{
    btn.onclick = ()=>{ nav.term = btn.dataset.term; renderSubjectMenu(); };
  });
}

function renderSubjectMenu(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="trace-row"><div class="node"></div><div class="line"></div><div class="node"></div></div>
    <div class="panel-card">
      <button class="back-link" id="backBtn">‹ back</button>
      <div class="kicker label-mono">STEP 2 OF 3</div>
      <h1>Choose a subject</h1>
      <div class="crumbs">${crumbHtml()}</div>
      <div class="menu-grid">
        ${SUBJECTS.map(s=>`<button class="menu-btn" data-subject="${s}">${s}</button>`).join('')}
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderTermMenu;
  document.querySelectorAll('[data-subject]').forEach(btn=>{
    btn.onclick = ()=>{ nav.subject = btn.dataset.subject; renderLessonMenu(); };
  });
}

function renderLessonMenu(){
  const app = document.getElementById('app');
  const subjData = QUESTIONS_DB[nav.term][nav.subject];
  const allCount = LESSON_NUMBERS.reduce((sum,n)=> sum + subjData["Lesson "+n].length, 0);

  const lessonButtons = LESSON_NUMBERS.map(n=>{
    const key = "Lesson "+n;
    const count = subjData[key].length;
    return `<button class="menu-btn" data-lesson="${key}">Lesson ${n}<span class="count">${count} question${count===1?'':'s'}</span></button>`;
  }).join('');

  app.innerHTML = `
    <div class="trace-row"><div class="node"></div><div class="line"></div><div class="node"></div></div>
    <div class="panel-card">
      <button class="back-link" id="backBtn">‹ back</button>
      <div class="kicker label-mono">STEP 3 OF 3</div>
      <h1>Choose a lesson</h1>
      <div class="crumbs">${crumbHtml()}</div>
      <div class="menu-grid cols2">${lessonButtons}</div>
      <div class="menu-grid">
        <button class="menu-btn all-lessons" data-lesson="__ALL__">All Lessons<span class="count">${allCount} question${allCount===1?'':'s'} combined${allCount > ALL_LESSONS_LENGTH ? ' — random '+ALL_LESSONS_LENGTH+' each play' : ''}</span></button>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderSubjectMenu;
  document.querySelectorAll('[data-lesson]').forEach(btn=>{
    btn.onclick = ()=>{
      nav.lesson = btn.dataset.lesson;
      startSelectedQuiz();
    };
  });
}

function startSelectedQuiz(){
  const subjData = QUESTIONS_DB[nav.term][nav.subject];
  let pool = [];
  let label = "";

  if(nav.lesson === "__ALL__"){
    LESSON_NUMBERS.forEach(n=>{ pool = pool.concat(subjData["Lesson "+n]); });
    label = "All Lessons";
  } else {
    pool = subjData[nav.lesson].slice();
    label = nav.lesson;
  }

  const shuffled = shuffle(pool);
  const cap = nav.lesson === "__ALL__" ? ALL_LESSONS_LENGTH : QUIZ_LENGTH;
  const selected = shuffled.length > cap ? shuffled.slice(0, cap) : shuffled;

  quizState = {
    idx:0, score:0, answered:false, timer:null, timeLeft:TIME_LIMIT,
    streak:0, bestStreak:0, partCounts:{}, questions: selected
  };

  if(pool.length === 0){
    renderEmptyState(label);
    return;
  }
  renderQuestion();
}

function renderEmptyState(label){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="trace-row"><div class="node"></div><div class="line"></div><div class="node"></div></div>
    <div class="panel-card">
      <button class="back-link" id="backBtn">‹ back</button>
      <div class="kicker label-mono">${nav.term} · ${nav.subject}</div>
      <h1>${label}</h1>
      <div class="empty-note">No questions have been added for this selection yet — check back once they're filled in.</div>
      <button class="btn-primary" id="menuBtn">Return to menu</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderLessonMenu;
  document.getElementById('menuBtn').onclick = renderTermMenu;
}

function currentTimeLimit(q){ return (typeof q.time === "number") ? q.time : TIME_LIMIT; }

function renderQuestion(){
  clearInterval(quizState.timer);
  const total = quizState.questions.length;
  const q = quizState.questions[quizState.idx];
  quizState.answered = false;
  const limit = currentTimeLimit(q);
  quizState.timeLeft = limit;

  const app = document.getElementById('app');
  const pct = (quizState.idx/total)*100;
  const tag = nav.lesson === "__ALL__" ? "All Lessons" : nav.lesson;

  let bodyHtml = "";
  if(q.type === "mc"){
    const optOrder = shuffle(q.opts.map((_,i)=>i));
    q._order = optOrder;
    bodyHtml = `
      <div class="options" id="options">
        ${optOrder.map((oi,pos)=>`
          <button class="opt" data-oi="${oi}">
            <span class="tag">${LETTERS[pos]}</span><span>${q.opts[oi]}</span>
          </button>
        `).join('')}
      </div>
    `;
  } else {
    bodyHtml = `
      <div class="type-wrap">
        <input type="text" class="type-input" id="typeInput" placeholder="Type your answer..." autocomplete="off">
        <button class="btn-primary" id="submitBtn">Submit</button>
        <div class="type-feedback" id="typeFeedback"></div>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="quiz-card">
      <div class="top-row">
        <span class="section-tag label-mono">${nav.subject.toUpperCase()} · ${tag.toUpperCase()}</span>
        <span class="label-mono">Q${quizState.idx+1} / ${total} &nbsp;·&nbsp; SCORE ${quizState.score}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="timer-wrap">
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-num label-mono" id="timerNum">${limit}</div>
      </div>
      <div class="q-text">${q.q}</div>
      ${bodyHtml}
      <div class="streak-note" id="streakNote">${quizState.streak>=2 ? quizState.streak+"-question streak" : ""}</div>
    </div>
  `;

  if(q.type === "mc"){
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=> selectMCAnswer(parseInt(btn.dataset.oi)));
    });
  } else {
    const input = document.getElementById('typeInput');
    const submit = document.getElementById('submitBtn');
    submit.addEventListener('click', ()=> selectTypeAnswer(input.value));
    input.addEventListener('keydown', (e)=>{ if(e.key === "Enter") selectTypeAnswer(input.value); });
    input.focus();
  }

  startTimer(limit, q.type);
}

function startTimer(limit, type){
  const fill = document.getElementById('timerFill');
  const num = document.getElementById('timerNum');
  quizState.timer = setInterval(()=>{
    quizState.timeLeft -= 1;
    if(num) num.textContent = Math.max(quizState.timeLeft,0);
    if(fill){
      const pct = Math.max(quizState.timeLeft,0)/limit*100;
      fill.style.width = pct+"%";
      fill.style.background = quizState.timeLeft<=5 ? "var(--wrong)" : "var(--amber)";
    }
    if(quizState.timeLeft<=0){
      clearInterval(quizState.timer);
      if(!quizState.answered){
        if(type === "mc") selectMCAnswer(null);
        else selectTypeAnswer(document.getElementById('typeInput') ? document.getElementById('typeInput').value : "");
      }
    }
  },1000);
}

function tallyResult(isCorrect){
  const q = quizState.questions[quizState.idx];
  const part = nav.lesson === "__ALL__" ? "All Lessons" : nav.lesson;
  if(!quizState.partCounts[part]) quizState.partCounts[part] = {correct:0,total:0};
  quizState.partCounts[part].total += 1;
  if(isCorrect){
    quizState.score += 1;
    quizState.streak += 1;
    quizState.bestStreak = Math.max(quizState.bestStreak, quizState.streak);
    quizState.partCounts[part].correct += 1;
  } else {
    quizState.streak = 0;
  }
}

function selectMCAnswer(chosenIdx){
  if(quizState.answered) return;
  quizState.answered = true;
  clearInterval(quizState.timer);
  const q = quizState.questions[quizState.idx];
  const isCorrect = chosenIdx === q.correct;
  tallyResult(isCorrect);

  document.querySelectorAll('.opt').forEach(btn=>{
    const oi = parseInt(btn.dataset.oi);
    btn.disabled = true;
    if(oi === q.correct) btn.classList.add('correct');
    else if(oi === chosenIdx) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  showNote(isCorrect, chosenIdx===null);
  advanceSoon();
}

function selectTypeAnswer(rawValue){
  if(quizState.answered) return;
  quizState.answered = true;
  clearInterval(quizState.timer);
  const q = quizState.questions[quizState.idx];
  const given = normalize(rawValue || "");
  const isCorrect = q.answers.some(a => normalize(a) === given);
  tallyResult(isCorrect);

  const input = document.getElementById('typeInput');
  const feedback = document.getElementById('typeFeedback');
  const submit = document.getElementById('submitBtn');
  if(input) input.disabled = true;
  if(submit) submit.disabled = true;
  if(input) input.classList.add(isCorrect ? 'correct' : 'wrong');
  if(feedback){
    feedback.classList.add(isCorrect ? 'correct' : 'wrong');
    feedback.textContent = isCorrect ? "Correct" : `Correct answer: ${q.answers[0]}`;
  }

  showNote(isCorrect, given === "");
  advanceSoon();
}

function showNote(isCorrect, timedOut){
  const note = document.getElementById('streakNote');
  if(!note) return;
  note.textContent = isCorrect
    ? (quizState.streak>=2 ? quizState.streak+"-question streak" : "Correct")
    : (timedOut ? "Time's up" : "Not quite");
  note.style.color = isCorrect ? "var(--cyan)" : "var(--wrong)";
}

function advanceSoon(){
  setTimeout(()=>{
    if(quizState.idx < quizState.questions.length-1){
      quizState.idx += 1;
      renderQuestion();
    } else {
      renderEnd();
    }
  }, 1400);
}

function renderEnd(){
  clearInterval(quizState.timer);
  const total = quizState.questions.length;
  const pct = Math.round((quizState.score/total)*100);
  const app = document.getElementById('app');

  const rows = Object.keys(quizState.partCounts).map(part=>{
    const c = quizState.partCounts[part];
    return `<div class="row"><span>${part}</span><span>${c.correct} / ${c.total}</span></div>`;
  }).join('');

  app.innerHTML = `
    <div class="trace-row"><div class="node"></div><div class="line"></div><div class="node"></div></div>
    <div class="end-card">
      <div class="kicker label-mono">RESULTS · ${nav.term} · ${nav.subject}</div>
      <div class="score-big">${quizState.score}/${total}</div>
      <div class="score-sub">${pct}% correct &nbsp;·&nbsp; best streak ${quizState.bestStreak}</div>
      <div class="breakdown">${rows}</div>
      <button class="btn-primary" id="retryBtn">Retry this quiz</button>
      <button class="btn-secondary" id="menuBtn">Back to menu</button>
    </div>
  `;
  document.getElementById('retryBtn').onclick = startSelectedQuiz;
  document.getElementById('menuBtn').onclick = renderTermMenu;
}

renderTermMenu();
</script>
</body>
